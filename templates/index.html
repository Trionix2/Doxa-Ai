<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doxa AI</title>
    <!-- Google Fonts & Material Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <!-- Highlight.js Dark Theme Stylesheet -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<!-- Highlight.js Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<!-- Include Marked.js for proper Markdown parsing -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- External CSS link -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    

<!-- Sidebar Layout -->
<aside id="sidebar">
    <div class="sidebar-header">
        <!-- Logo area now acts as the expand button when collapsed -->
<div class="logo-area" onclick="toggleSidebarWithSpin(this)" title="Toggle sidebar" style="cursor: pointer;">
    <span class="material-icons-outlined">hub</span>
    <span class="sidebar-title">DOXA AI</span>
</div>
        
        <!-- Hamburger menu button to collapse -->
        <button class="icon-btn toggle-sidebar-btn" onclick="toggleSidebar()" title="Close sidebar">
            <span class="material-icons-outlined">menu</span>
        </button>
    </div>

    <button class="new-chat-btn" onclick="resetChat()">
        <span class="material-icons-outlined">add</span>
        <span class="btn-text">New Chat</span>
    </button>

    <div class="history-container" id="sidebar-history">
        <!-- Dynamic History Appended Here -->
    </div>

    <div class="sidebar-footer">
        <div class="user-profile-info">
            <div class="user-avatar" style="min-width: 32px; width: 32px; height: 32px; background-color: var(--accent); color: var(--bg-main); font-weight: 600; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px;">
                {{ username[0] | upper }}
            </div>
            <span class="username-display" style="font-size: 14px; font-weight: 500; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                {{ username }}
            </span>
        </div>
        
        <a href="/logout" title="Sign Out" class="logout-btn">
            <span class="material-icons-outlined" style="font-size: 20px;">logout</span>
        </a>
    </div>
</aside>
<!-- Main Section -->
<main>
<!-- Welcome View -->
 <!-- Mobile Toggle Button with your Doxa Logo Icon -->
<button class="icon-btn mobile-menu-btn" onclick="toggleSidebar()" title="Toggle Menu" style="display: none; background: none; border: none; color: var(--accent-color, #a855f7); cursor: pointer; padding: 8px; position: absolute; top: 12px; left: 12px; z-index: 99;">
    <span class="material-icons-outlined">hub</span>
</button>
    <div class="welcome-screen" id="welcome-screen">
        
        <!-- 3D Spinning Logo -->
        <div class="doxa-3d-logo-wrapper">
            <span class="material-icons-outlined doxa-spinning-logo">hub</span>
        </div>

        <h1>Doxa AI core is online. How can I assist you today?</h1>
        <p>Your high-performance workspace companion powered by Gemini.</p>
        <div class="input-box-wrapper">
            <textarea id="user-input" rows="1" placeholder="Type your command or query..." autofocus></textarea>
            
            <div class="attachment-menu" id="attachment-menu-welcome">
                <label class="menu-item">
                    <span class="material-icons-outlined">image</span> Upload Image
                    <input type="file" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">
                </label>
                <label class="menu-item">
                    <span class="material-icons-outlined">insert_drive_file</span> Upload Document
                    <input type="file" accept=".pdf,.txt,.py,.js,.html,.css" style="display: none;" onchange="handleFileSelect(event)">
                </label>
                <label class="menu-item">
                    <span class="material-icons-outlined">code</span> Code Snippet
                    <input type="file" accept=".js,.py,.html,.css,.json" style="display: none;" onchange="handleFileSelect(event)">
                </label>
            </div>

            <div class="input-actions">
                <button class="icon-btn plus-btn" id="plus-btn-welcome" onclick="toggleAttachmentMenu('welcome')" title="Add content">
                    <span class="material-icons-outlined">add</span>
                </button>
                <button class="send-btn" onclick="sendMessage()"><span class="material-icons-outlined" style="font-size: 18px;">arrow_upward</span></button>
            </div>
        </div>
    </div>
    <!-- Active Chat Feed Container -->
    <div class="chat-container" id="chat-container" style="display: none;">
        <!-- Dynamic Messages Go Here -->
    </div>

    <!-- Fixed Active Input Area Bottom -->
    <div class="active-input-container" id="active-input-area" style="display: none;">
        <div class="input-box-wrapper">
            <textarea id="user-input-active" rows="1" placeholder="Reply to Doxa AI..."></textarea>
            
            <div class="attachment-menu" id="attachment-menu-active">
                <label class="menu-item">
                    <span class="material-icons-outlined">image</span> Upload Image
                    <input type="file" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">
                </label>
                <label class="menu-item">
                    <span class="material-icons-outlined">insert_drive_file</span> Upload Document
                    <input type="file" accept=".pdf,.txt,.py,.js,.html,.css" style="display: none;" onchange="handleFileSelect(event)">
                </label>
                <label class="menu-item">
                    <span class="material-icons-outlined">code</span> Code Snippet
                    <input type="file" accept=".js,.py,.html,.css,.json" style="display: none;" onchange="handleFileSelect(event)">
                </label>
            </div>

            <div class="input-actions">
                <!-- Left side: Plus button & Model/Personality Selector -->
                <div style="display: flex; align-items: center; gap: 8px;">
                    <button class="icon-btn plus-btn" id="plus-btn-active" onclick="toggleAttachmentMenu('active')" title="Add content">
                        <span class="material-icons-outlined">add</span>
                    </button>
                    
                    <!-- Personality / Model Dropdown Selector -->
                    <div class="model-selector-wrapper">
                        <button class="model-select-btn" onclick="toggleModelDropdown()">
                            <span id="current-model-label">Helper Mode</span>
                            <span class="material-icons-outlined" style="font-size: 16px;">arrow_drop_down</span>
                        </button>
                        
                        <div class="model-dropdown-menu" id="modelDropdown">
                            <button class="model-option active" onclick="selectPersonality('Flash-Lite', 'standard')">Helper Mode (Standard)</button>
                            <button class="model-option" onclick="selectPersonality('Concise', 'less words, direct and straight to the point')">⚡ Concise & Short</button>
                            <button class="model-option" onclick="selectPersonality('Friendly', 'warm, engaging, and supportive')">🎉 Friendly Vibe</button>
                            <button class="model-option" onclick="selectPersonality('Serious', 'professional, technical, and objective')">💼 Serious & Professional</button>
                            <button class="model-option" onclick="selectPersonality('Coding Only', 'strict code snippets and minimal chatter')">💻 Code Only Mode</button>
                        </div>
                    </div>
                </div>

                <!-- Right side: Send button -->
                <button class="send-btn" onclick="sendMessage()"><span class="material-icons-outlined" style="font-size: 18px;">arrow_upward</span></button>
            </div>
        </div>
    </div>
</main>
    <!-- External JavaScript Link -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
